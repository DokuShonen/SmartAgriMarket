
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartagrimarket
      POSTGRES_USER: smartagri
      POSTGRES_PASSWORD: smartagri
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartagri"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      additional_contexts:
        m2: ${HOME}/.m2/repository
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartagrimarket
      SPRING_DATASOURCE_USERNAME: smartagri
      SPRING_DATASOURCE_PASSWORD: smartagri
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
