<div class="catalogue-page">
  <app-loading *ngIf="chargement || erreur" [erreur]="erreur" (retry)="reessayer()"></app-loading>

  <ng-container *ngIf="!chargement && !erreur">
  <!-- HEADER + SEARCH -->
  <div class="catalogue-top">
    <h1>Catalogue</h1>
    <p class="catalogue-count">{{ totalElements }} produit(s)</p>
    <app-search-bar
      [query]="keyword"
    (queryChange)="keyword = $event; onSearch()"
    placeholder="Rechercher un produit..."
    ariaLabel="Rechercher un produit"
  ></app-search-bar>
  </div>

  <!-- FILTER CHIPS -->
  <app-filter-chips
    [chips]="categoryChips"
    [selected]="selectedCategorie"
    (selectedChange)="selectedCategorie = $event; onSearch()"
  ></app-filter-chips>

  <!-- PRICE FILTERS -->
  <div class="price-filters">
    <div class="price-input">
      <label for="prixMin">Min</label>
      <input id="prixMin" type="number" [(ngModel)]="prixMin" (input)="onSearch()" placeholder="0" />
    </div>
    <span class="price-sep">—</span>
    <div class="price-input">
      <label for="prixMax">Max</label>
      <input id="prixMax" type="number" [(ngModel)]="prixMax" (input)="onSearch()" placeholder="∞" />
    </div>
    <div class="price-input">
      <label for="localite">Localité</label>
      <input id="localite" type="text" [(ngModel)]="localite" (input)="onSearch()" placeholder="Ville..." />
    </div>
    <button class="reset-btn" *ngIf="hasFilters" (click)="resetFilters()" aria-label="Reinitialiser les filtres">
      <span class="material-icons-outlined">close</span>
    </button>
  </div>

  <!-- RESULTS GRID -->
  <div class="product-grid" *ngIf="produits.length; else empty">
    <app-product-card
      *ngFor="let p of produits"
      [link]="'/produits/' + p.id"
      [image]="getProductImage(p)"
      [title]="p.titre"
      [price]="p.prix"
      [unit]="p.uniteVente"
      [stock]="p.quantiteDisponible"
      [location]="p.localite"
      [verified]="p.vendeurEstVerifie"
      [category]="p.categorie"
    ></app-product-card>
  </div>

  <ng-template #empty>
    <app-empty-state
      icon="search_off"
      title="Aucun produit trouvé"
      description="Essayez de modifier vos filtres"
      actionLabel="Réinitialiser"
      actionIcon="restart_alt"
      *ngIf="hasFilters"
      (actionClick)="resetFilters()"
    ></app-empty-state>
    <app-empty-state
      icon="search_off"
      title="Aucun produit trouvé"
      description="Aucun produit n'est disponible pour le moment"
      *ngIf="!hasFilters"
    ></app-empty-state>
  </ng-template>

  <!-- PAGINATION -->
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="prevPage()" [disabled]="page === 0" class="page-btn" aria-label="Page precedente">
      <span class="material-icons-outlined">chevron_left</span>
    </button>
    <span class="page-info">{{ page + 1 }} / {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page >= totalPages - 1" class="page-btn" aria-label="Page suivante">
      <span class="material-icons-outlined">chevron_right</span>
    </button>
  </div>
  </ng-container>
</div>
