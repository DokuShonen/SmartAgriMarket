spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartagrimarket
    username: ${DB_USERNAME:smartagri}
    password: ${DB_PASSWORD:smartagri}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:SmartAgriMarket2026SecretKeyWithEnoughLengthForHmacSha256!!}
  expiration: 604800000

sms:
  provider: ${SMS_PROVIDER:logging}
  orange:
    api-url: ${ORANGE_SMS_API_URL:https://api.orange.com}
    client-id: ${ORANGE_SMS_CLIENT_ID:}
    client-secret: ${ORANGE_SMS_CLIENT_SECRET:}

logging:
  level:
    com.smartagrimarket: DEBUG
