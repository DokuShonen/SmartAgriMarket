spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartagrimarket
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:SmartAgriMarket2026SecretKeyWithEnoughLengthForHmacSha256!!}
  expiration: 86400000

logging:
  level:
    com.smartagrimarket: DEBUG
