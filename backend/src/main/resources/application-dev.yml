spring:
  datasource:
    url: jdbc:h2:mem:smartagrimarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.smartagrimarket: INFO
